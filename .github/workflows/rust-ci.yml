# 可复用 workflow:Rust 质量门禁
#
# 提供跨 Rust 项目统一的质量门禁,三个并行 job:
#   - fmt:    cargo fmt --all -- --check(格式检查,不编译)
#   - clippy: cargo clippy --all-targets -- -D warnings(编译 + lint;warning 升 error)
#   - deny:   cargo deny check(供应链审计:漏洞 / 许可证 / 禁用 crate / 来源)
#
# 不含测试 -- 测试模式因项目而异(单 crate / workspace / nextest / e2e 需外部服务),
# 后续单独做测试模板;调用方若需测试,在仓库自行加 job。
#
# 前后端混合仓库(Rust 编译期嵌入前端产物,如 nsfintech/rsflow 的 rust-embed):
# 传 prebuilt-artifact / prebuilt-path,clippy job 会先下载前置 job(通常由
# node-ci 模板构建)上传的产物到指定路径,再跑 clippy。不传则行为不变。
#
# 运行在调用方仓库上下文(GITHUB_REPOSITORY 为调用方),自动 lint 调用方代码。
# 调用方需在仓库根提供 deny.toml(cargo-deny 配置,per-repo;各仓库依赖不同,不共享)。
# 调用方 stub 见 workflow-templates/rust-ci.yml。
name: rust-ci (reusable)

on:
  workflow_call:
    inputs:
      toolchain:
        description: 'Rust toolchain channel(stable/beta/nightly 或具体版本如 1.97);edition 2024 需 1.85+'
        type: string
        default: stable
      prebuilt-artifact:
        description: '前置构建产物 artifact 名(如 web-dist);非空则 clippy job 先下载该 artifact 解压到 prebuilt-path。需与上传方(node-ci 模板的 artifact-name)同名,且调用方 workflow 里 clippy 所在 job 需 needs 上传 job。注意:调用方需在该 job 级授予 contents: read + actions: read(download-artifact 需要 actions: read,被调 workflow 无法自行提升权限)'
        type: string
        default: ''
      prebuilt-path:
        description: '前置构建产物解压目标路径,相对仓库根(如 web/dist);仅 prebuilt-artifact 非空时生效'
        type: string
        default: ''

jobs:
  fmt:
    name: cargo fmt
    runs-on: [self-hosted, linux]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ inputs.toolchain }}
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: cargo clippy
    runs-on: [self-hosted, linux]
    # 故意不声明 permissions:GitHub 校验"被调 job 声明 ⊆ caller 授予",
    # 声明 actions: read 会让未授予该权限的调用方(仅 contents: read)整个 run
    # 直接 startup_failure(零 job)。不声明则继承 caller job 级权限:普通
    # 调用方得 contents: read(与不传 prebuilt 时一致);传 prebuilt-artifact
    # 的调用方在自身 job 级授 contents: read + actions: read 即可下载产物。
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ inputs.toolchain }}
          components: clippy
      # 前端产物嵌入场景:先取前置 job(node-ci 构建)上传的产物(如 web/dist),
      # 让 rust-embed 等编译期嵌入有物可嵌。v4 artifact 内容即上传目录下的文件,
      # 直接解到目标路径即还原目录结构。
      - uses: actions/download-artifact@v4
        if: inputs.prebuilt-artifact != ''
        with:
          name: ${{ inputs.prebuilt-artifact }}
          path: ${{ inputs.prebuilt-path }}
      # repsy 私有 registry 凭证桥接(runner .env -> cargo 认的环境变量名)。
      # 依赖私有 crate 的仓库(如 gateway 拉 rslog)需要;不依赖的仓库 REPSY_CARGO_TOKEN
      # 为空则跳过,cargo 走公开 crates.io 不受影响。mask 防意外回显(与 repy-publish 同款)。
      - name: 桥接 repsy cargo 凭证(依赖私有 crate 时)
        run: |
          if [ -n "${REPSY_CARGO_TOKEN:-}" ]; then
            echo "::add-mask::$REPSY_CARGO_TOKEN"
            echo "CARGO_REGISTRIES_REPSY_TOKEN=$REPSY_CARGO_TOKEN" >> "$GITHUB_ENV"
          fi
      # 构建工具兜底:libz-ng-sys(pingora 传递依赖)等 -sys crate 需 cmake;
      # 自托管 runner 系统更新可能移除已装工具(2026-09 实例:cmake 消失致 gateway clippy 红),
      # 缺则按发行版补装,有则跳过(幂等,几秒)。
      - name: 补齐构建工具链(缺则装)
        run: |
          command -v cmake >/dev/null 2>&1 && exit 0
          echo "cmake 缺失,按发行版补装..."
          if command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq cmake
          elif command -v dnf >/dev/null 2>&1; then
            sudo dnf install -y -q cmake
          elif command -v yum >/dev/null 2>&1; then
            sudo yum install -y -q cmake
          else
            echo "::error::runner 无 cmake 且不识别包管理器,请手工补齐(自托管 runner 预置工具漂移)"
            exit 1
          fi
          command -v cmake >/dev/null 2>&1 || { echo "::error::cmake 安装后仍不可用,请检查 PATH"; exit 1; }
      - run: cargo clippy --all-targets -- -D warnings

  deny:
    name: cargo deny
    runs-on: [self-hosted, linux]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      # 同 clippy job:repsy 凭证桥接(cargo-deny 拉 crate 源码扫许可证也需要)
      - name: 桥接 repsy cargo 凭证(依赖私有 crate 时)
        run: |
          if [ -n "${REPSY_CARGO_TOKEN:-}" ]; then
            echo "::add-mask::$REPSY_CARGO_TOKEN"
            echo "CARGO_REGISTRIES_REPSY_TOKEN=$REPSY_CARGO_TOKEN" >> "$GITHUB_ENV"
          fi
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features --workspace
