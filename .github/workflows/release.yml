# 本仓库（nsfintech/.github）自身的发布。
#
# 用 release-please 自动打 tag + 发 GitHub release；发版后把 @v1 major tag 前移到新版本，
# 使各调用方 uses: nsfintech/.github/.github/workflows/<name>.yml@v1 自动跟进非破坏性更新。
#
# 工作机制：推 Conventional Commits 到 main -> release-please 开 release PR ->
# 合并该 PR -> 本 workflow 再跑一次，release-please 创建 tag + release ->
# update-major-tag 作业把 @v1 前移到新 tag。
name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    uses: ./.github/workflows/release-please.yml
    with:
      release-type: simple
    secrets: inherit

  update-major-tag:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Move @v1 major tag to ${{ needs.release-please.outputs.tag_name }}
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -e
          major="${TAG%%.*}"   # v1.1.0 -> v1
          echo "moving ${major} -> ${TAG}"
          git tag -f "$major" "$TAG"
          git push -f origin "$major"
