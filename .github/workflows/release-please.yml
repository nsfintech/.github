# 可复用 workflow：自动版本发布（release-please）
#
# 基于 Conventional Commits 自动管理版本：往目标分支推 feat/fix 等提交后，release-please
# 会开/更新一个 release PR（含 CHANGELOG 与版本号 bump）；合并该 PR 即自动打 tag、发
# GitHub release、改版本号文件（如 Cargo.toml）。
#
# 运行在调用方仓库上下文（GITHUB_REPOSITORY 为调用方），自动管理调用方的发布。
# 暴露 outputs（release_created / tag_name / prerelease）供调用方做发版后处理（如前移
# major tag 时跳过预发布）。调用方 stub 见 workflow-templates/release-please.yml。
#
# App token（替代 GITHUB_TOKEN）：本 workflow 从自托管 runner 读 GitHub App 凭证
# （Client ID 走 runner .env 的 RELEASE_PLEASE_APP_CLIENT_ID；私钥 PEM 以文件放 runner 上、
# .env 配路径 RELEASE_PLEASE_APP_PRIVATE_KEY_FILE）换 installation token，用它开 release PR /
# 推 tag。App 是可信协作者 -> release PR 触发的 pull_request workflow（如各仓 rust-ci）不被
# action_required 审批门禁挡；App 推的 tag 也触发下游 on: push: tags workflow（如
# docker-build-push）。凭证放 runner 是因为 org 是 Free、无 org 级 secrets；caller 无需再配
# token/secret。未配凭证或换取失败则回退 GITHUB_TOKEN（不阻断发版）。
# App 的创建/安装/凭证见 README「App token（GitHub App 认证）」。
#
# 与官方 googleapis/release-please-action 不同：本 workflow 不依赖该 action（其内置
# release-please 包、无法指向我们的 fork），而是 checkout 自建 fork（nsfintech/release-please）、
# npm install + 编译后，通过一个内联 JS driver 直接调其 JS API（Manifest.fromConfig /
# createReleases / createPullRequests）——与官方 action 同款入口。这样调用方自动用上 fork
# 里对 Rust workspace 共享版本（version.workspace = true）的修复。
#
# 为何用 JS driver 而非 CLI：release-please CLI 非 manifest 模式切不了预发布 tag——
# `release-pr` 命令没有 `--prerelease` 布尔 flag，而 PrereleaseVersioningStrategy 的 bump
# 模式由 prerelease===true 控制（CLI 不传则默认 false -> 走 graduation，把 rc 剥成 stable）。
# 直接调 Manifest.fromConfig 才能按分支切 rc，且需要同时传 versioning:'prerelease'
# （选 PrereleaseVersioningStrategy）+ prerelease:true（走 bump）+ prereleaseType；只传
# prerelease:true 会被默认策略忽略、仍出 stable（dry-run 实测）。不需要 release-please-config.json
# / .release-please-manifest.json，不污染调用方仓库。
#
# prerelease 模式（caller 传 prerelease:true，通常对应 test 分支）：
#   - 切 vX.Y.Z-rc.N（release-please 自动递增 rc.1/rc.2），GH release 标为 prerelease
#   - 跳过 CHANGELOG.md 文件写入（留 GH Release notes），避免与 main 的 CHANGELOG 冲突
#   - 不前移 major tag、不打 docker latest（由 caller 的 update-major-tag / docker
#     metadata-action 按 prerelease 输出 / semver 预发布识别各自过滤）
#   - graduation 自动:依赖 fork(nsfintech/release-please)的改动--stable 模式找 baseline
#     时跳过 prerelease tag,test 合并到 main 后 main 自动切 stable(rc.N -> X.Y.Z)。
#     详见 README「graduation」。
name: release-please (reusable)

on:
  workflow_call:
    inputs:
      release-type:
        description: 'release-please release type (rust/node/python/go/java/simple...)；多包独立版本的 workspace 省略此项，改用仓库内 release-please-config.json（此时 prerelease 需在 config 文件里配，下方 prerelease 输入不生效）'
        type: string
        required: false
      release-please-ref:
        description: 'fork（nsfintech/release-please）的分支/commit/tag，默认 main（最新）；追求可复现时固定到一个 commit'
        type: string
        required: false
        default: main
      token:
        description: 'GitHub token，作为 App token 不可用时的回退（默认调用方 GITHUB_TOKEN）。正常无需传：本 workflow 自动从 runner env 的 App 凭证换 installation token（见下方 App token 步骤）。仅在 runner 未配 App 凭证、又需 release PR/tag 触发下游 workflow 时传 PAT/App token'
        type: string
        required: false
      prerelease:
        description: 'true=预发布模式，切 vX.Y.Z-rc.N（不前移 @v1、不写 CHANGELOG.md）；默认 false=stable。caller 按分支传（test 分支传 true、main 传 false）'
        type: boolean
        default: false
      prerelease-type:
        description: '预发布类型，默认 rc（生成 vX.Y.Z-rc.N）'
        type: string
        default: 'rc'
      extra-files:
        description: '随 release PR 同步更新的额外文件（release-please extra-files 语法，JSON 数组字符串，如 [{"type":"toml","path":"template/Cargo.toml","jsonpath":"$.dependencies.foo.version"}]）。toml/yaml/json/xml 类型用 jsonpath/xpath 定位精确替换（保注释）；generic 类型用 "version" 注释标记。不传则行为不变'
        type: string
        required: false
        default: ''
      sync-back-to:
        description: 'stable 发版后自动开 PR 同步回的分支，默认 test（组织模型：main 发 stable 必同步回 test，防版本基线落后）。仅 stable release 触发（rc 不触发）；幂等（无领先提交或同向 PR 已存在则跳过）。不使用双分支模型的仓库显式传空串关闭'
        type: string
        required: false
        default: 'test'
    outputs:
      release_created:
        description: '本次运行是否创建了 release（"true" / "false"）'
        value: ${{ jobs.release-please.outputs.release_created }}
      tag_name:
        description: '本次创建的 release tag（如 v1.1.0 或 v1.1.0-rc.3）；未发版则为空'
        value: ${{ jobs.release-please.outputs.tag_name }}
      prerelease:
        description: '本次创建的 release 是否为预发布（"true" / "false"）；用于让 caller 的 major-tag 前移等作业跳过 rc'
        value: ${{ jobs.release-please.outputs.prerelease }}

jobs:
  release-please:
    runs-on: [self-hosted, linux]
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      # 调用方仓库本体（需要其 release-please-config.json / Cargo.toml 等），以及
      # 合并 release PR 后的 tag（github-release 打在该 merge commit 上，即本次 push 的 HEAD）。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # fork 的 release-please 源码（prepare 脚本会自动 npm run compile，这里再显式编译兜底）
      - uses: actions/checkout@v4
        with:
          repository: nsfintech/release-please
          ref: ${{ inputs.release-please-ref }}
          path: release-please

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # 用 GitHub App（而非默认 GITHUB_TOKEN）开 release PR / 推 tag：App 身份是可信协作者，
      # release PR 触发的 pull_request workflow（如各仓 rust-ci）不会被挂 action_required 而需
      # 人工审批；App 推的 tag 也能触发下游 on: push: tags 的 workflow（如 docker-build-push，
      # GITHUB_TOKEN 推的 tag 不触发）。凭证放自托管 runner 上、由 workflow 读入（org 是 Free、
      # 无 org 级 secrets，故不放 GitHub secret），caller 无需配 token/secret。
      #   - Client ID：runner .env 的 RELEASE_PLEASE_APP_CLIENT_ID（单行）。
      #   - 私钥 PEM：直接以文件放 runner 上（如 /etc/nsfintech/release-please-app.pem），.env 只存
      #     路径 RELEASE_PLEASE_APP_PRIVATE_KEY_FILE。不 base64、不塞 env 变量——PEM 本来就是多行
      #     文件，直接 cat 读进来最稳。.env 未配路径则回退 GITHUB_TOKEN。
      # 任一环节失败（缺配置 / 文件不存在 / 换 token 报错）都回退 GITHUB_TOKEN、不阻断发版。
      # 同一 job 内换 token + 用 token，无需 skip-token-revoke（post 撤销在 job 末尾）。
      - name: 载入 release-please App 凭证（Client ID 从 .env、私钥从 runner 文件）
        id: app-creds
        run: |
          cid="${RELEASE_PLEASE_APP_CLIENT_ID:-}"
          keyfile="${RELEASE_PLEASE_APP_PRIVATE_KEY_FILE:-}"
          if [ -z "$cid" ] || [ -z "$keyfile" ]; then
            echo "::notice::runner 未配 RELEASE_PLEASE_APP_CLIENT_ID / RELEASE_PLEASE_APP_PRIVATE_KEY_FILE，回退 GITHUB_TOKEN"
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ ! -f "$keyfile" ]; then
            echo "::error::私钥文件不存在: $keyfile。把 PEM 放到 runner 上并在 .env 配 RELEASE_PLEASE_APP_PRIVATE_KEY_FILE，回退 GITHUB_TOKEN"
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pk="$(cat "$keyfile")"
          case "$pk" in
            *'-----BEGIN'*) : ;;
            *) echo "::error::$keyfile 不是 PEM（缺 -----BEGIN），回退 GITHUB_TOKEN" ; echo "configured=false" >> "$GITHUB_OUTPUT" ; exit 0 ;;
          esac
          echo "::add-mask::$pk"
          echo "RELEASE_PLEASE_APP_CLIENT_ID=$cid" >> "$GITHUB_ENV"
          {
            echo "RELEASE_PLEASE_APP_PRIVATE_KEY<<EOF"
            echo "$pk"
            echo "EOF"
          } >> "$GITHUB_ENV"
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - id: app-token
        if: ${{ steps.app-creds.outputs.configured == 'true' }}
        uses: actions/create-github-app-token@v3
        continue-on-error: true
        with:
          client-id: ${{ env.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ env.RELEASE_PLEASE_APP_PRIVATE_KEY }}

      - name: App token 换取失败告警
        if: ${{ steps.app-creds.outputs.configured == 'true' && steps.app-token.outcome == 'failure' }}
        run: echo "::warning::create-github-app-token 失败（检查 Client ID / 私钥 PEM / App 是否安装到本仓库 / 权限 Contents+PRs+Issues write），回退 GITHUB_TOKEN"

      - name: Build release-please
        working-directory: release-please
        run: |
          npm install --no-audit --no-fund
          npm run compile

      # 内联 JS driver：直接调 fork 的 JS API（与官方 action 同款），绕过 CLI 无法切 rc 的限制。
      # 用引号定界符 <<'DRIVER' 关闭 shell 展开，driver 内的 JS 字符串原样落盘。
      - name: Write release-please driver
        run: |
          cat > "$RUNNER_TEMP/rp-driver.js" <<'DRIVER'
          const path = require('path');
          // driver 写在 $RUNNER_TEMP，require 相对解析会找不到 fork；用 cwd（caller workspace 根）锚定。
          const {GitHub, Manifest} = require(path.join(process.cwd(), 'release-please/build/src/index.js'));
          const fs = require('fs');

          function out(k, v) {
            const f = process.env.GITHUB_OUTPUT;
            if (f) fs.appendFileSync(f, k + '=' + v + '\n');
          }

          async function main() {
            const [owner, repo] = String(process.env.GITHUB_REPOSITORY).split('/');
            const targetBranch = process.env.TARGET_BRANCH;
            const releaseType = process.env.RELEASE_TYPE || undefined;
            const prerelease = process.env.PRERELEASE === 'true';
            const prereleaseType = process.env.PRERELEASE_TYPE || undefined;
            const dryRun = process.env.DRY_RUN === '1';
            const cmd = process.env.CMD;

            const github = await GitHub.create({
              owner: owner,
              repo: repo,
              token: process.env.TOKEN,
              apiUrl: 'https://api.github.com',
              graphqlUrl: 'https://api.github.com',
              defaultBranch: targetBranch,
            });

            let manifest;
            if (releaseType) {
              // 非 manifest 模式：靠 git tag 跟踪版本，不需要 release-please-config.json。
              // 切 rc 必须同时设 versioning:'prerelease'(选 PrereleaseVersioningStrategy)
              // + prerelease:true(走 bump 而非 graduation) + prereleaseType;只传 prerelease:true
              // 会被默认策略忽略、仍出 stable(dry-run 实测确认)。
              const releaserConfig = {
                releaseType: releaseType,
                prerelease: prerelease,
                prereleaseType: prereleaseType,
                draft: false,
                includeComponentInTag: false,
              };
              // extra-files（可选，JSON 数组字符串）：随 release PR 同步更新的额外文件。
              // 非法 JSON 直接抛错（driver catch 后 job 红），静默忽略会导致调用方以为同步了实际没有。
              if (process.env.EXTRA_FILES) {
                releaserConfig['extra-files'] = JSON.parse(process.env.EXTRA_FILES);
              }
              if (prerelease) {
                releaserConfig.versioning = 'prerelease';
                // rc 跳过 CHANGELOG.md 文件写入(只留 GH Release notes),避免与 main 的
                // CHANGELOG 冲突/污染。skipChangelog 只跳文件,release notes 照样生成。
                releaserConfig.skipChangelog = true;
              }
              manifest = await Manifest.fromConfig(github, targetBranch, releaserConfig, {}, '.');
            } else {
              // 多包 workspace：读仓库内 release-please-config.json，prerelease 由该文件控制。
              manifest = await Manifest.fromManifest(github, targetBranch,
                'release-please-config.json', '.release-please-manifest.json', {});
            }

            if (cmd === 'github-release') {
              const releases = dryRun
                ? await manifest.buildReleases()
                : (await manifest.createReleases()).filter(Boolean);
              const tagOf = r => r.tagName || (r.tag && r.tag.toString()) || '';
              // CreatedRelease 的 prerelease 字段在非 manifest 路径下不一定可靠,
              // 按 tag 形状判定: vX.Y.Z-<pre> 即预发布(v1.1.0-rc / v1.1.0-rc.1)。
              const preOf = r => /^v?[0-9]+\.[0-9]+\.[0-9]+-/.test(tagOf(r));
              console.log('releases:', JSON.stringify(releases.map(r => ({
                tag: tagOf(r), prerelease: preOf(r), path: r.path,
              }))));
              if (!dryRun) {
                const root = releases[0];
                if (root) {
                  out('release_created', 'true');
                  out('tag_name', tagOf(root));
                  out('prerelease', String(preOf(root)));
                } else {
                  out('release_created', 'false');
                }
              }
            } else if (cmd === 'release-pr') {
              if (dryRun) {
                const prs = await manifest.buildPullRequests();
                for (const pr of prs) {
                  console.log('pr:', JSON.stringify({
                    title: (pr.title && pr.title.toString()) || pr.title,
                    version: pr.version && pr.version.toString(),
                  }));
                }
              } else {
                const nums = await manifest.createPullRequests();
                console.log('prs:', JSON.stringify(nums));
              }
            } else {
              throw new Error('CMD must be github-release or release-pr, got: ' + cmd);
            }
          }

          main().catch(e => {
            console.error((e && e.stack) || e);
            process.exit(1);
          });
          DRIVER

      - id: release
        name: Create GitHub release
        env:
          TOKEN: ${{ steps.app-token.outputs.token || inputs.token || secrets.GITHUB_TOKEN }}
          RELEASE_TYPE: ${{ inputs.release-type }}
          PRERELEASE: ${{ inputs.prerelease }}
          PRERELEASE_TYPE: ${{ inputs.prerelease-type }}
          TARGET_BRANCH: ${{ github.ref_name }}
          EXTRA_FILES: ${{ inputs.extra-files }}
          CMD: github-release
        run: node "$RUNNER_TEMP/rp-driver.js"

      - name: Create release PR
        env:
          TOKEN: ${{ steps.app-token.outputs.token || inputs.token || secrets.GITHUB_TOKEN }}
          RELEASE_TYPE: ${{ inputs.release-type }}
          PRERELEASE: ${{ inputs.prerelease }}
          PRERELEASE_TYPE: ${{ inputs.prerelease-type }}
          TARGET_BRANCH: ${{ github.ref_name }}
          EXTRA_FILES: ${{ inputs.extra-files }}
          CMD: release-pr
        run: node "$RUNNER_TEMP/rp-driver.js"

      # ── stable 发版后自动开 同步回 PR（opt-in：sync-back-to 非空才跑）────────
      # 动机:release commit（版本号/CHANGELOG）只落在发版分支（如 main）,若不回同步,
      # 开发分支（如 test）的版本基线会持续落后,下个 rc 周期起跳点错乱、版本文件冲突
      # 滚雪球。rc 不触发（rc 本身在 test 上,无需同步;也防误配反向同步）。
      # 时机:release_created 且非 prerelease 的此刻——tag 已打、release commit 已在
      #   main,test 通常静着（下个 rc 周期未开始）,冲突窗口最小。
      # 只开 PR 不自动合并:test 可能已进 rc 周期,版本文件冲突需人工裁决（取 main 侧
      #   高版本号）。合并请用 merge commit（历史即血统）。
      # 幂等:无领先提交（compare ahead_by=0）或同向 PR 已存在时静默跳过。
      - name: Open sync-back PR（stable 发版后）
        if: ${{ inputs.sync-back-to != '' && steps.release.outputs.release_created == 'true' && steps.release.outputs.prerelease == 'false' && github.ref_name != inputs.sync-back-to }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || inputs.token || secrets.GITHUB_TOKEN }}
          SYNC_TO: ${{ inputs.sync-back-to }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          set -euo pipefail
          # 目标分支不存在(单分支仓库未显式关 sync-back)则跳过,不 fail
          if ! gh api "repos/${GITHUB_REPOSITORY}/branches/${SYNC_TO}" --jq '.name' >/dev/null 2>&1; then
            echo "::notice::分支 ${SYNC_TO} 不存在(单分支仓库?),跳过 sync-back;不需要可在调用处传 sync-back-to: '' 关闭"
            exit 0
          fi
          ahead=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${SYNC_TO}...${GITHUB_REF_NAME}" --jq '.ahead_by' 2>/dev/null || echo 1)
          if [ "$ahead" = "0" ]; then
            echo "::notice::${GITHUB_REF_NAME} 无领先 ${SYNC_TO} 的提交，无需同步"
            exit 0
          fi
          echo "${GITHUB_REF_NAME} 领先 ${SYNC_TO} ${ahead} 个提交，创建同步 PR"
          body="$(printf '自动同步 PR：release-please 在 %s 发出 stable 版 %s 后触发。\n\n' "$GITHUB_REF_NAME" "$TAG"
            printf '此 PR 把发版分支的 release commit（版本号/CHANGELOG）带回 %s，使其版本基线与已发 stable 对齐，下个 rc 周期从 %s 起跳。\n\n' "$SYNC_TO" "$TAG"
            printf '## 合并方式\n\n**Create a merge commit**（不要 squash/rebase——历史即发布血统）。\n\n' 
            printf '## 若有版本文件冲突（%s 已进 rc 周期）\n\n取本 PR 侧（%s）的高版本号；Rust 仓库解决后重跑 \\'cargo generate-lockfile\\' 校准 lock。\n' "$SYNC_TO" "$GITHUB_REF_NAME")"
          if ! err=$(gh pr create \
              --base "$SYNC_TO" --head "$GITHUB_REF_NAME" \
              --title "chore: sync ${GITHUB_REF_NAME} → ${SYNC_TO}（${TAG} released）" \
              --body "$body" 2>&1); then
            case "$err" in
              *'already exists'*) echo "::notice::同向 PR 已存在，幂等跳过（PR head 指向分支头，自动含本次 release commit）" ;;
              *) echo "::error::同步 PR 创建失败：$err"; exit 1 ;;
            esac
          else
            echo "$err"
          fi
