# starter 模板：各仓库 Actions -> New workflow 选 "Release please" 后，本文件被复制到
# 该仓库的 .github/workflows/release-please.yml，成为调用方 stub。
#
# 分支与发布模型（test->main + hotfix）：
#   - feature/* 从 test 拉、合并回 test（test 是集成分支）
#   - 推 feat/fix 到 test -> release-please 开 "chore(test): release X.Y.Z-rc.N" PR ->
#     合并该 PR -> 自动打 vX.Y.Z-rc.N tag + GH prerelease（rc.1/rc.2 自动递增）。
#     rc 不写 CHANGELOG.md（留 GH Release notes）、不前移 major tag、不打 docker latest。
#   - test 合并到 main -> main 自动开 "chore(main): release X.Y.Z" PR -> 合并 ->
#     打 vX.Y.Z tag + GH stable release。依赖 fork(nsfintech/release-please)的 graduation
#     改动:stable 模式跳过 prerelease tag 作 baseline,rc tag 进 main 不会挡 stable 发版。
#     详见 README「graduation」。
#   - hotfix/* 从 main 拉（不碰 test 未验证工作）-> 合并回 main（切 patch stable）+
#     回合并到 test（让 test 不落后）。详见 nsfintech/.github README「分支与发布模型」。
#
# 工作机制：推 Conventional Commits 到 main/test -> release-please 按 prerelease 输入
# 切 rc 或 stable。test 分支需在 branch-cleanup 里 exclude-patterns 排除（长期分支）。
#
# 认证：caller 无需配 token/secret。可复用 workflow 自动从自托管 runner .env 读 GitHub App
# 凭证换 installation token 开 PR / 推 tag（App 是可信协作者 -> release PR 触发的
# pull_request workflow 如 rust-ci 不被 action_required 审批门禁挡；App 推的 tag 也触发下游
# on: push: tags workflow 如 docker-build-push）。App 的创建/安装/凭证见
# nsfintech/.github README「App token（GitHub App 认证）」。
name: release-please

on:
  push:
    branches: [main, test]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    uses: nsfintech/.github/.github/workflows/release-please.yml@v1
    with:
      # 按项目类型改：rust / node / python / go / java / simple
      # 多包独立版本的 workspace：省略 release-type，在仓库加 release-please-config.json
      #   （此时 prerelease 需在该 config 文件里配，下面的 prerelease 输入不生效）
      release-type: rust
      # test 分支切 rc 预发布（vX.Y.Z-rc.N），main 切 stable。分支名不同改这里的判断。
      prerelease: ${{ github.ref_name == 'test' }}
      prerelease-type: rc
      # 可选：固定 fork（nsfintech/release-please）版本，默认 main（跟随最新）
      # release-please-ref: <commit>
    secrets: inherit
